# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: lending-aave-envio
description: Aave v3 position history (Ethereum, Base, Arbitrum), HyperIndex port of lending-indexer
# Rows are keyed by (id, chainId), like Ponder's (chainId, txHash, logIndex) keys.
disable_default_cross_chain: true
# Addresses arrive lowercase, as Ponder stores them.
address_format: lowercase
field_selection:
  transaction_fields: [hash, from]
contracts:
  - name: Pool
    events:
      - event: Supply(address indexed reserve, address user, address indexed onBehalfOf, uint256 amount, uint16 indexed referralCode)
      - event: Withdraw(address indexed reserve, address indexed user, address indexed to, uint256 amount)
      - event: Borrow(address indexed reserve, address user, address indexed onBehalfOf, uint256 amount, uint8 interestRateMode, uint256 borrowRate, uint16 indexed referralCode)
      - event: Repay(address indexed reserve, address indexed user, address indexed repayer, uint256 amount, bool useATokens)
      - event: ReserveUsedAsCollateralEnabled(address indexed reserve, address indexed user)
      - event: ReserveUsedAsCollateralDisabled(address indexed reserve, address indexed user)
      - event: LiquidationCall(address indexed collateralAsset, address indexed debtAsset, address indexed user, uint256 debtToCover, uint256 liquidatedCollateralAmount, address liquidator, bool receiveAToken)
  - name: AWeth
    events:
      - event: Transfer(address indexed from, address indexed to, uint256 value)
chains:
  - id: 1
    start_block: ${START_BLOCK_1:-0}
    end_block: ${END_BLOCK_1:-}
    contracts:
      - name: Pool
        address: "0x87870bca3f3fd6335c3f4ce8392d69350b4fa4e2"
      - name: AWeth
        address: "0x4d5f47fa6a74757f35c14fd3a6ef8e3c9bc514e8"
  - id: 8453
    start_block: ${START_BLOCK_8453:-0}
    end_block: ${END_BLOCK_8453:-}
    contracts:
      - name: Pool
        address: "0xa238dd80c259a72e81d7e4664a9801593f98d1c5"
      - name: AWeth
        address: "0xd4a0e0b9149bcee3c920d2e00b5de09138fd8bb7"
  - id: 42161
    start_block: ${START_BLOCK_42161:-0}
    end_block: ${END_BLOCK_42161:-}
    contracts:
      - name: Pool
        address: "0x794a61358d6845594f94dc1db02a252b5b4814ad"
      - name: AWeth
        address: "0xe50fa9b3c56ffb159cb0fca61f5c9d750e8128c8"
